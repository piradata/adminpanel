<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Server Admin Dashboard</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Central hub for Linux server administration and service management — Authentik, media stack, networking, and more."
    />
    <!-- Discover font from HTML (not CSS) to break HTML→CSS→font chain -->
    <link rel="preload" href="/fonts/geist-sans.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" as="image" href="/favicon.ico" fetchpriority="high" />
    <style>
      @font-face {
        font-family: "Geist";
        src: url("/fonts/geist-sans.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Geist Mono";
        src: url("/fonts/geist-mono.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
    </style>
  </head>
  <body style="font-family: 'Geist', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
