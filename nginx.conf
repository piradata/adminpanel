# Nginx configuration for serving the Next.js app on port 80
user nginx;
worker_processes 2;  # Force exactly two workers
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    # With 2 workers * 1024 connections gives theoretical 2048 concurrent connections
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 20M;

    # Compression for textual assets
    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Serve static Vite build output
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Cache immutable assets (adjust patterns as needed)
        location ~* \.(?:js|css|woff2?|ttf|eot|svg)$ {
            expires 7d;
            add_header Cache-Control "public";
        }

        # SPA fallback for client-side routing
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
